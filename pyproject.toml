[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlwarden"
version = "0.1.0"
description = "MLWarden worker SDK"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.23,<1.0"]

[tool.setuptools]
package-dir = {"" = "mlwarden/sdk"}
packages = ["mlwarden"]

